<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🌸</title>

  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #bg {
      z-index: 0;
    }

    #tree {
      z-index: 1;
    }

    /* Màn hình mở đầu */
    #initial {
      position: fixed;
      bottom: 24%;
      left: 50%;
      z-index: 20;
      cursor: pointer;
      text-align: center;
      transform: translateX(-50%);
      transition: opacity 0.6s ease;
      font-family: "Dancing Script", cursive;
    }

    #initial .flower {
      display: inline-block;
      font-size: clamp(70px, 9vw, 110px);
      animation: pulse 1.1s ease-in-out infinite;
      filter:
        drop-shadow(0 0 12px #ff69b4)
        drop-shadow(0 0 28px #ff1493)
        drop-shadow(0 0 46px #c71585);
    }

    #initial .label {
      margin-top: 6px;
      color: #ffb6c1;
      font-size: clamp(22px, 2.6vw, 32px);
      letter-spacing: 2px;
      line-height: 1.7;
      text-shadow: 0 0 10px #ff69b4, 0 0 22px #ff1493;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    /*
      CỘT BÊN TRÁI:
      - Rộng hơn để chữ ưu tiên mở theo chiều ngang.
      - Tối đa 43vw hoặc 580px.
      - Cây đặt khoảng 80% màn hình nên vẫn có khoảng trống bên phải.
    */
    #content-column {
      position: fixed;
      top: 8vh;
      left: 3vw;
      z-index: 10;

      width: min(43vw, 580px);
      max-width: 580px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;

      pointer-events: none;
    }

    /*
      Ảnh vuông:
      - Nằm chính giữa content-column.
      - Chỉ xuất hiện sau khi cây hoa nở xong.
    */
    #birthday-photo {
      width: min(28vw, 300px);
      aspect-ratio: 1 / 1;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    #birthday-photo.visible {
      opacity: 1;
      visibility: visible;
    }

    #birthday-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;

      border: 2px solid rgba(255, 105, 180, 0.58);
      border-radius: 18px;
      box-shadow: 0 0 18px rgba(255, 20, 147, 0.30);
    }

    /*
      KHUNG LỜI CHÚC:
      - width: fit-content: khung sẽ nở ngang theo câu chữ.
      - max-width: 100%: không vượt ra khỏi content-column.
      - white-space: nowrap ở desktop để ưu tiên một dòng.
      - Khi dòng quá dài, max-width vẫn giới hạn nó an toàn.
    */
    #message {
      width: fit-content;
      min-width: min(340px, 100%);
      max-width: 100%;

      min-height: 110px;
      max-height: 58vh;
      overflow-y: auto;
      overflow-x: hidden;

      padding: 16px 24px;
      color: #fff;
      opacity: 0;
      text-align: center;

      font-family: "Dancing Script", cursive;
      font-size: clamp(17px, 1.75vw, 26px);
      line-height: 1.65;

      background: rgba(15, 0, 12, 0.48);
      border: 1px solid rgba(255, 105, 180, 0.25);
      border-radius: 16px;
      box-shadow: 0 0 16px rgba(255, 20, 147, 0.13);

      transition:
        opacity 0.7s ease,
        width 0.25s ease;
    }

    #message span {
      display: block;
      width: max-content;
      max-width: 100%;

      white-space: nowrap;
      overflow-wrap: anywhere;

      text-shadow:
        0 0 5px #ff69b4,
        0 0 9px #ff1493;
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    /* Mobile: nội dung đặt giữa, tree ở dưới/trung tâm */
    @media (max-width: 780px) {
      /* Tắt icon nền trên điện thoại để bớt lag */
      #bg {
        display: none;
      }

      #initial {
        bottom: 30%;
      }

      #content-column {
        top: 5vh;
        left: 50%;
        width: 88vw;
        max-width: 460px;
        gap: 14px;
        transform: translateX(-50%);
      }

      #birthday-photo {
        width: min(48vw, 190px);
      }

      #message {
        width: fit-content;
        min-width: min(82vw, 330px);
        max-width: 100%;
        max-height: 44vh;

        padding: 14px 16px;
        font-size: clamp(15px, 4vw, 22px);
      }

      #message span {
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <!--
    Upload birthday.mp3 vào cùng thư mục với index.html.
    Nếu file có tên khác, sửa lại đường dẫn src.
  -->
  <audio id="bg-music" loop preload="auto">
    <source src="./birthday.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!--
    Upload image.jpg vào cùng thư mục với index.html.
    Nếu ảnh có tên birthday.jpg thì đổi src="./birthday.jpg".
  -->
  <div id="content-column">
    <div id="birthday-photo">
      <img src="./image.jpg" alt="Birthday photo">
    </div>

    <div id="message"></div>
  </div>

  <canvas id="bg"></canvas>
  <canvas id="tree"></canvas>

  <div id="initial" onclick="startAnimation()">
    <div class="flower">🌸</div>
    <div class="label">Click Me :)<br>Birthday Queen!</div>
  </div>

  <script>
    const bgCanvas = document.getElementById("bg");
    const bgContext = bgCanvas.getContext("2d");

    const treeCanvas = document.getElementById("tree");
    const treeContext = treeCanvas.getContext("2d");

    let width = 0;
    let height = 0;

    function resizeCanvas() {
      width = bgCanvas.width = treeCanvas.width = window.innerWidth;
      height = bgCanvas.height = treeCanvas.height = window.innerHeight;

      treeCache = null;
      flowerCache = null;

      if (treeFinished) bakeTree();
      if (flowersFinished) bakeFlowers();
    }

    window.addEventListener("resize", resizeCanvas);

    /*
      Sửa lời chúc ở đây.
      Mỗi chuỗi là một dòng được gõ dần.
    */
    const LINES = [
      "Hey you 🌸",
      "Happy Birthday 🎂",
      "May God bless you 😇",
      "And give you lots of happiness ✨",
      "Just saying... you are pretty awesome 😍",
      "Hope you have a great day today 🌸"
    ];

    const COLORS = [
      "#ff69b4",
      "#ff1493",
      "#e0115f",
      "#ff4d6d",
      "#ff85a1",
      "#ffb3c6",
      "#ffc2d4",
      "#d63384",
      "#c71585",
      "#ff6b9d",
      "#ffa07a"
    ];

    const FLOATING_EMOJIS = [
      "🌸", "🌺", "🌷",
      "💕", "💖",
      "🎁", "🎂",
      "✨", "⭐",
      "🎈", "🎉"
    ];

    const pick = list => list[Math.floor(Math.random() * list.length)];

    /*
      PHẦN NỀN:
      Chỉ 10–24 emoji, render ở 12 FPS để tránh lag.
    */
    const particles = [];

    function createParticle(randomY) {
      return {
        x: Math.random() * width,
        y: randomY ? Math.random() * height : height + 16,
        velocityY: 0.16 + Math.random() * 0.24,
        velocityX: (Math.random() - 0.5) * 0.16,
        radius: 2.5 + Math.random() * 2.5,
        alpha: 0,
        maxAlpha: 0.12 + Math.random() * 0.22,
        wave: Math.random() * Math.PI * 2,
        emoji: pick(FLOATING_EMOJIS)
      };
    }

    function initializeParticles() {
      particles.length = 0;

      const total = Math.min(
        24,
        Math.max(10, Math.round((width * height) / 65000))
      );

      for (let i = 0; i < total; i++) {
        particles.push(createParticle(true));
      }
    }

    let lastBackgroundFrame = 0;
    const backgroundFPS = 12;
    const backgroundFrameInterval = 1000 / backgroundFPS;

    function drawBackground(timestamp) {
      if (timestamp - lastBackgroundFrame < backgroundFrameInterval) return;

      lastBackgroundFrame = timestamp;
      bgContext.clearRect(0, 0, width, height);

      for (const particle of particles) {
        particle.alpha = Math.min(
          particle.maxAlpha,
          particle.alpha + 0.012
        );

        particle.y -= particle.velocityY;

        particle.x +=
          particle.velocityX +
          Math.sin(timestamp * 0.0007 + particle.wave) * 0.12;

        if (particle.y < -30) {
          Object.assign(particle, createParticle(false));
        }

        bgContext.globalAlpha = particle.alpha;
        bgContext.font = `${particle.radius * 1.8}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
        bgContext.textAlign = "center";
        bgContext.textBaseline = "middle";
        bgContext.fillText(particle.emoji, particle.x, particle.y);
      }

      bgContext.globalAlpha = 1;
    }

    function drawFlowerShape(context, centerX, centerY, size) {
      context.beginPath();

      const petals = 5;

      for (let i = 0; i < petals; i++) {
        const angle = (Math.PI * 2 / petals) * i;
        const petalX = centerX + Math.cos(angle) * size * 0.9;
        const petalY = centerY + Math.sin(angle) * size * 0.9;

        context.moveTo(centerX, centerY);
        context.arc(petalX, petalY, size * 0.55, 0, Math.PI * 2);
      }

      context.closePath();
    }

    let branches = [];
    let flowers = [];

    let treeFinished = false;
    let flowersFinished = false;
    let treeStartTime = null;

    let treeCache = null;
    let flowerCache = null;

    let animationPhase = "idle";
    let phaseStartTime = 0;

    const rollingFlower = {
      x: 0,
      y: 0,
      rotation: 0,
      scale: 1,
      alpha: 1,
      size: 50
    };

    let trail = [];
    let trailOpacity = 1;

    let groundY = 0;
    let dropStartY = 0;
    let rollStartX = 0;
    let rollEndX = 0;
    let heartTreeX = 0;
    let heartTreeY = 0;

    const easeInQuad = value => value * value;
    const easeOutCubic = value => 1 - Math.pow(1 - value, 3);

    function updateFlowerAnimation(timestamp) {
      if (animationPhase === "drop") {
        const duration = 600;
        const progress = Math.min(
          1,
          (timestamp - phaseStartTime) / duration
        );

        const eased = easeInQuad(progress);

        rollingFlower.y =
          dropStartY + (groundY - dropStartY) * eased;

        rollingFlower.rotation =
          eased * 0.35 * (rollEndX < rollStartX ? -1 : 1);

        trail.push({
          x: rollingFlower.x,
          y: rollingFlower.y
        });

        if (progress >= 1) {
          animationPhase = "roll";
          phaseStartTime = timestamp;
        }
      } else if (animationPhase === "roll") {
        const duration = 850;
        const progress = Math.min(
          1,
          (timestamp - phaseStartTime) / duration
        );

        const eased = easeOutCubic(progress);

        rollingFlower.x =
          rollStartX + (rollEndX - rollStartX) * eased;

        const jumpHeight =
          10 * Math.pow(1 - progress, 1.6);

        rollingFlower.y =
          groundY -
          Math.abs(Math.sin(progress * Math.PI * 4)) * jumpHeight;

        rollingFlower.rotation =
          (rollingFlower.x - rollStartX) /
          rollingFlower.size *
          0.55;

        trail.push({
          x: rollingFlower.x,
          y: rollingFlower.y
        });

        if (progress >= 1) {
          animationPhase = "settle";
          phaseStartTime = timestamp;
        }
      } else if (animationPhase === "settle") {
        const duration = 400;
        const progress = Math.min(
          1,
          (timestamp - phaseStartTime) / duration
        );

        rollingFlower.x = rollEndX;
        rollingFlower.y = groundY;
        rollingFlower.alpha = 1 - progress;
        rollingFlower.scale = 1 + progress * 0.35;
        trailOpacity = 1 - progress;

        if (treeStartTime === null) {
          treeStartTime = timestamp;
          buildFlowerTree(heartTreeX, heartTreeY);
        }

        if (progress >= 1) {
          animationPhase = "grow";
          rollingFlower.alpha = 0;
          trailOpacity = 0;
        }
      }
    }

    function drawTrail() {
      if (trail.length < 2 || trailOpacity <= 0) return;

      treeContext.save();
      treeContext.lineCap = "round";
      treeContext.lineJoin = "round";

      treeContext.strokeStyle = "#ff1493";
      treeContext.lineWidth = 5;
      treeContext.globalAlpha = trailOpacity * 0.2;

      treeContext.beginPath();
      treeContext.moveTo(trail[0].x, trail[0].y);

      for (let i = 1; i < trail.length; i++) {
        treeContext.lineTo(trail[i].x, trail[i].y);
      }

      treeContext.stroke();

      treeContext.strokeStyle = "#ffc2d4";
      treeContext.lineWidth = 1.8;
      treeContext.globalAlpha = trailOpacity * 0.7;

      treeContext.beginPath();
      treeContext.moveTo(trail[0].x, trail[0].y);

      for (let i = 1; i < trail.length; i++) {
        treeContext.lineTo(trail[i].x, trail[i].y);
      }

      treeContext.stroke();
      treeContext.restore();
    }

    function drawRollingFlower() {
      if (rollingFlower.alpha <= 0) return;

      treeContext.save();
      treeContext.translate(rollingFlower.x, rollingFlower.y);
      treeContext.rotate(rollingFlower.rotation);
      treeContext.scale(rollingFlower.scale, rollingFlower.scale);
      treeContext.globalAlpha = rollingFlower.alpha;

      treeContext.fillStyle = "#ff1493";
      drawFlowerShape(
        treeContext,
        0,
        -rollingFlower.size * 0.4,
        rollingFlower.size
      );
      treeContext.fill();

      treeContext.fillStyle = "#ff85a1";
      drawFlowerShape(
        treeContext,
        0,
        -rollingFlower.size * 0.4 + 2,
        rollingFlower.size * 0.72
      );
      treeContext.fill();

      treeContext.restore();
    }

    function getHeartPoint(value) {
      const x = 16 * Math.pow(Math.sin(value), 3);

      const y = -(
        13 * Math.cos(value) -
        5 * Math.cos(2 * value) -
        2 * Math.cos(3 * value) -
        Math.cos(4 * value)
      );

      return { x, y };
    }

    function addBranch(startX, startY, endX, endY, lineWidth, delay) {
      branches.push({
        startX,
        startY,
        endX,
        endY,
        lineWidth,
        delay
      });
    }

    function addInnerBranch(x, y, angle, length, lineWidth, delay) {
      if (length < 6 || lineWidth < 0.8) return;

      const endX = x + Math.cos(angle) * length;
      const endY = y + Math.sin(angle) * length;

      addBranch(x, y, endX, endY, lineWidth, delay);

      const spread = 0.4;
      const shrink = 0.64;

      if (Math.random() > 0.42) {
        addInnerBranch(
          endX,
          endY,
          angle - spread,
          length * shrink,
          lineWidth * 0.65,
          delay + 75
        );
      }

      if (Math.random() > 0.42) {
        addInnerBranch(
          endX,
          endY,
          angle + spread,
          length * shrink,
          lineWidth * 0.65,
          delay + 75
        );
      }
    }

    function buildFlowerTree(rootX, rootY) {
      branches = [];

      const scale = Math.min(width, height) * 0.024;
      const stemHeight = height * 0.07;
      const stemTopY = rootY - stemHeight;

      addBranch(rootX, rootY, rootX, stemTopY, 9, 0);

      const points = 16;

      for (const direction of [1, -1]) {
        let previousX = rootX;
        let previousY = stemTopY;
        let previousWidth = 8;
        let delay = 150;

        for (let i = 1; i <= points; i++) {
          const t =
            Math.PI +
            direction * Math.PI * i / points;

          const point = getHeartPoint(t);

          const currentX = rootX + point.x * scale;
          const currentY =
            stemTopY - (17 - point.y) * scale;

          const currentWidth = Math.max(
            1.4,
            previousWidth * 0.94
          );

          addBranch(
            previousX,
            previousY,
            currentX,
            currentY,
            currentWidth,
            delay
          );

          if (i > 2 && i < points - 1 && i % 4 === 0) {
            const centerY = stemTopY - 11 * scale;

            const angle =
              Math.atan2(centerY - currentY, rootX - currentX) +
              (Math.random() - 0.5) * 0.35;

            addInnerBranch(
              currentX,
              currentY,
              angle,
              scale * (1.9 + Math.random() * 1.2),
              currentWidth * 0.48,
              delay + 35
            );
          }

          previousX = currentX;
          previousY = currentY;
          previousWidth = currentWidth;
          delay += 54;
        }
      }
    }

    function drawBranch(context, startX, startY, endX, endY, lineWidth) {
      context.lineCap = "round";
      context.strokeStyle = "#ffc2d4";
      context.lineWidth = Math.max(1, lineWidth * 0.55);
      context.globalAlpha = 0.88;

      context.beginPath();
      context.moveTo(startX, startY);
      context.lineTo(endX, endY);
      context.stroke();
    }

    function bakeTree() {
      treeCache = document.createElement("canvas");
      treeCache.width = width;
      treeCache.height = height;

      const context = treeCache.getContext("2d");

      for (const branch of branches) {
        drawBranch(
          context,
          branch.startX,
          branch.startY,
          branch.endX,
          branch.endY,
          branch.lineWidth
        );
      }
    }

    function createFlowers(rootX, rootY) {
      flowers = [];

      const scale = Math.min(width, height) * 0.024;
      const stemHeight = height * 0.07;

      const centerX = rootX;
      const centerY = (rootY - stemHeight) - 11 * scale;

      const radiusX = 16 * scale * 1.05;
      const radiusY = 11 * scale * 1.05;

      for (let i = 0; i < 70; i++) {
        const t = Math.random() * Math.PI * 2;
        const point = getHeartPoint(t);
        const spread = 0.22 + Math.random() * 0.78;

        flowers.push({
          x:
            centerX +
            (point.x / 16) * radiusX * spread +
            (Math.random() - 0.5) * 14,

          y:
            centerY +
            ((point.y - 6) / 11) * radiusY * spread +
            (Math.random() - 0.5) * 14,

          size: 4 + Math.random() * 6,
          color: pick(COLORS),
          delay: performance.now() + i * 12 + Math.random() * 260
        });
      }

      for (let i = 0; i < 20; i++) {
        const t = Math.random() * Math.PI * 2;
        const point = getHeartPoint(t);

        flowers.push({
          x:
            centerX +
            (point.x / 16) * radiusX +
            (Math.random() - 0.5) * 8,

          y:
            centerY +
            ((point.y - 6) / 11) * radiusY +
            (Math.random() - 0.5) * 8,

          size: 3 + Math.random() * 3.5,
          color: pick(COLORS),
          delay: performance.now() + i * 14 + Math.random() * 240
        });
      }
    }

    function bakeFlowers() {
      flowerCache = document.createElement("canvas");
      flowerCache.width = width;
      flowerCache.height = height;

      const context = flowerCache.getContext("2d");

      for (const flower of flowers) {
        context.fillStyle = flower.color;
        drawFlowerShape(context, flower.x, flower.y, flower.size);
        context.fill();
      }
    }

    function render(timestamp) {
      drawBackground(timestamp);
      treeContext.clearRect(0, 0, width, height);

      if (animationPhase !== "idle") {
        updateFlowerAnimation(timestamp);
      }

      if (treeStartTime !== null) {
        const elapsed = timestamp - treeStartTime;

        if (treeCache) {
          treeContext.drawImage(treeCache, 0, 0);
        } else {
          let allBranchesDone = true;

          for (const branch of branches) {
            const progress = Math.min(
              1,
              Math.max(0, (elapsed - branch.delay) / 210)
            );

            if (progress < 1) allBranchesDone = false;
            if (progress <= 0) continue;

            const currentX =
              branch.startX +
              (branch.endX - branch.startX) * progress;

            const currentY =
              branch.startY +
              (branch.endY - branch.startY) * progress;

            drawBranch(
              treeContext,
              branch.startX,
              branch.startY,
              currentX,
              currentY,
              branch.lineWidth
            );
          }

          if (
            allBranchesDone &&
            branches.length > 0 &&
            !treeFinished
          ) {
            treeFinished = true;
            bakeTree();
            createFlowers(heartTreeX, heartTreeY);
          }
        }

        if (flowerCache) {
          treeContext.drawImage(flowerCache, 0, 0);
        } else if (treeFinished) {
          let allFlowersDone = true;

          for (const flower of flowers) {
            const progress = Math.min(
              1,
              Math.max(0, (timestamp - flower.delay) / 140)
            );

            if (progress < 1) allFlowersDone = false;
            if (progress <= 0) continue;

            treeContext.globalAlpha = progress;
            treeContext.fillStyle = flower.color;

            drawFlowerShape(
              treeContext,
              flower.x,
              flower.y,
              flower.size * progress
            );

            treeContext.fill();
          }

          treeContext.globalAlpha = 1;

          if (
            allFlowersDone &&
            flowers.length > 0 &&
            !flowersFinished
          ) {
            flowersFinished = true;
            bakeFlowers();
            startTypewriter();
          }
        }
      }

      if (
        animationPhase === "drop" ||
        animationPhase === "roll" ||
        animationPhase === "settle"
      ) {
        drawTrail();
        drawRollingFlower();
      }

      requestAnimationFrame(render);
    }

    function startAnimation() {
      if (animationPhase !== "idle") return;

      const music = document.getElementById("bg-music");

      if (music) {
        music.volume = 0.35;

        music.play().catch(error => {
          console.log("Không phát được nhạc:", error);
        });
      }

      const intro = document.getElementById("initial");
      const introFlower = intro.querySelector(".flower");
      const position = introFlower.getBoundingClientRect();

      rollingFlower.x = position.left + position.width / 2;
      rollingFlower.y = position.top + position.height / 2;
      rollingFlower.size = Math.max(
        38,
        Math.min(64, position.width * 0.55)
      );

      rollingFlower.alpha = 1;
      rollingFlower.rotation = 0;
      rollingFlower.scale = 1;

      intro.style.opacity = "0";

      setTimeout(() => {
        intro.style.display = "none";
      }, 300);

      groundY = height * 0.86;
      dropStartY = rollingFlower.y;
      rollStartX = rollingFlower.x;

      /*
        Cây đặt ở 80% màn hình desktop:
        chừa vùng rộng cho text box nở theo chiều ngang.
      */
      rollEndX =
        width < 780
          ? width * 0.5
          : width * 0.80;

      heartTreeX = rollEndX;
      heartTreeY = groundY;

      trail = [{
        x: rollingFlower.x,
        y: rollingFlower.y
      }];

      trailOpacity = 1;
      animationPhase = "drop";
      phaseStartTime = performance.now();
    }

    function startTypewriter() {
      const photo = document.getElementById("birthday-photo");
      const message = document.getElementById("message");

      photo.classList.add("visible");
      message.style.opacity = "1";

      let line = 0;

      function typeNextLine() {
        if (line >= LINES.length) return;

        const textElement = document.createElement("span");
        textElement.style.borderRight = "2px solid #ff69b4";
        textElement.style.animation = "blink .65s step-end infinite";

        message.appendChild(textElement);

        /*
          Ép browser đo lại size content để khung nở ngang theo câu đang gõ.
        */
        message.style.width = "fit-content";
        message.style.maxWidth = "100%";

        const text = LINES[line];
        let character = 0;

        const timer = setInterval(() => {
          if (character <= text.length) {
            textElement.textContent = text.substring(0, character);
            character++;
          } else {
            clearInterval(timer);

            textElement.style.borderRight = "none";
            textElement.style.animation = "none";

            line++;
            setTimeout(typeNextLine, 380);
          }
        }, 52);
      }

      typeNextLine();
    }

    resizeCanvas();
    initializeParticles();

    window.addEventListener("resize", initializeParticles);

    requestAnimationFrame(render);
  </script>
</body>
</html>
