<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; color: #fff; background: #060007; }
    canvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

    .aurora-bg { position: fixed; inset: 0; z-index: -4; background: radial-gradient(circle at 15% 20%, rgba(255,20,147,.18), transparent 31%), radial-gradient(circle at 83% 74%, rgba(124,58,237,.16), transparent 34%), radial-gradient(circle at 57% 12%, rgba(255,130,180,.10), transparent 28%), linear-gradient(135deg, #050006 0%, #170012 50%, #030004 100%); background-size: 130% 130%; animation: auroraMove 16s ease-in-out infinite alternate; }
    @keyframes auroraMove { from { background-position: 0% 0%,100% 100%,50% 0%,0% 0%; } to { background-position: 18% 12%,82% 88%,68% 16%,100% 100%; } }
    .glow-orb { position: fixed; z-index: -3; width: 32vmax; height: 32vmax; border-radius: 50%; filter: blur(55px); opacity: .14; pointer-events: none; }
    .orb-one { top: -18vmax; left: -12vmax; background: #ff1493; animation: driftOne 18s ease-in-out infinite alternate; }
    .orb-two { right: -15vmax; bottom: -22vmax; background: #6d28d9; opacity: .12; animation: driftTwo 22s ease-in-out infinite alternate; }
    @keyframes driftOne { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(12vw,8vh,0) scale(1.15); } }
    @keyframes driftTwo { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(-12vw,-10vh,0) scale(1.16); } }
    .sparkles { position: fixed; inset: 0; z-index: -2; overflow: hidden; pointer-events: none; }
    .sparkles span { position: absolute; width: 4px; height: 4px; border-radius: 50%; opacity: .25; background: #ffd1ec; box-shadow: 0 0 5px #ff69b4, 0 0 12px #ff1493; animation: twinkle 2.8s ease-in-out infinite alternate; }
    .sparkles span:nth-child(1) { top:12%;left:7%;animation-delay:0s; }.sparkles span:nth-child(2) { top:28%;left:20%;animation-delay:.7s; }.sparkles span:nth-child(3) { top:8%;left:42%;animation-delay:1.3s; }.sparkles span:nth-child(4) { top:20%;left:71%;animation-delay:.4s; }.sparkles span:nth-child(5) { top:12%;left:91%;animation-delay:1.8s; }.sparkles span:nth-child(6) { top:43%;left:6%;animation-delay:1.2s; }.sparkles span:nth-child(7) { top:51%;left:34%;animation-delay:.2s; }.sparkles span:nth-child(8) { top:39%;left:58%;animation-delay:1.5s; }.sparkles span:nth-child(9) { top:62%;left:82%;animation-delay:.9s; }.sparkles span:nth-child(10) { top:76%;left:14%;animation-delay:1.9s; }.sparkles span:nth-child(11) { top:85%;left:39%;animation-delay:.5s; }.sparkles span:nth-child(12) { top:80%;left:61%;animation-delay:1.1s; }
    @keyframes twinkle { from { opacity:.12; transform:scale(.55); } to { opacity:.92; transform:scale(1.7); } }

    #initial { position:fixed; bottom:24%; left:50%; z-index:20; cursor:pointer; text-align:center; transform:translateX(-50%); transition:opacity .6s ease; font-family:"Dancing Script",cursive; }
    #initial .flower-button { display:inline-block; font-size:clamp(72px,9vw,112px); animation:pulse 1.1s ease-in-out infinite; filter:drop-shadow(0 0 12px #ff69b4) drop-shadow(0 0 28px #ff1493) drop-shadow(0 0 48px #c71585); }
    #initial .label { margin-top:7px; color:#ffb6d9; font-size:clamp(22px,2.6vw,33px); letter-spacing:1.5px; line-height:1.55; text-shadow:0 0 10px #ff69b4,0 0 22px #ff1493; }
    @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.18); } }

    #content-column { position:fixed; top:8vh; left:3vw; z-index:10; width:min(43vw,580px); max-width:580px; display:flex; flex-direction:column; align-items:center; gap:18px; pointer-events:none; }
    #birthday-photo { width:min(28vw,300px); aspect-ratio:1/1; opacity:0; visibility:hidden; transition:opacity .7s ease,visibility .7s ease; }
    #birthday-photo.visible { opacity:1; visibility:visible; }
    #birthday-photo img { display:block; width:100%; height:100%; object-fit:cover; border:2px solid rgba(255,105,180,.6); border-radius:18px; box-shadow:0 0 22px rgba(255,20,147,.35); }
    #message { width:fit-content; min-width:min(340px,100%); max-width:100%; min-height:105px; max-height:51vh; overflow-y:auto; overflow-x:hidden; padding:16px 24px; border:1px solid rgba(255,105,180,.25); border-radius:16px; color:#fff; opacity:0; text-align:center; font-family:"Dancing Script",cursive; font-size:clamp(17px,1.75vw,26px); line-height:1.65; background:rgba(17,0,14,.52); box-shadow:0 0 16px rgba(255,20,147,.14); transition:opacity .7s ease; }
    #message span { display:block; width:max-content; max-width:100%; white-space:nowrap; overflow-wrap:anywhere; text-shadow:0 0 5px #ff69b4,0 0 9px #ff1493; }
    @keyframes blink { 50% { border-color:transparent; } }

    #wish-link { position:fixed; bottom:6vh; left:50%; z-index:50; display:inline-flex; align-items:center; justify-content:center; padding:12px 20px; border:1px solid rgba(255,220,238,.75); border-radius:999px; color:#fff; cursor:pointer; opacity:0; visibility:hidden; pointer-events:auto; text-decoration:none; transform:translateX(-50%) translateY(12px); font-family:"Poppins",sans-serif; font-size:13px; font-weight:700; letter-spacing:.3px; white-space:nowrap; background:linear-gradient(135deg,#ff1493,#8b5cf6); box-shadow:0 0 18px rgba(255,20,147,.45); transition:opacity .5s ease,visibility .5s ease,transform .5s ease,filter .2s ease; }
    #wish-link.visible { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
    #wish-link:hover { filter:brightness(1.15); }

    @media (max-width:780px) { .glow-orb { filter:blur(38px);opacity:.1; }.sparkles span:nth-child(n+9) { display:none; } #initial { bottom:30%; } #content-column { top:5vh;left:50%;width:88vw;max-width:460px;gap:14px;transform:translateX(-50%); } #birthday-photo { width:min(48vw,190px); } #message { min-width:min(82vw,330px);max-height:43vh;padding:14px 16px;font-size:clamp(15px,4vw,22px); } #message span { white-space:normal; } #wish-link { bottom:3vh;max-width:88vw;padding:11px 16px;text-align:center;white-space:normal;font-size:12px; } }
    @media (prefers-reduced-motion:reduce) { .aurora-bg,.glow-orb,.sparkles span,#initial .flower-button { animation:none !important; } }
  </style>
</head>
<body>
  <div class="aurora-bg"></div>
  <div class="glow-orb orb-one"></div>
  <div class="glow-orb orb-two"></div>
  <div class="sparkles"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <audio id="bg-music" loop preload="auto"><source src="./birthday.mp3" type="audio/mpeg"></audio>

  <div id="content-column">
    <div id="birthday-photo"><img src="./image.jpg" alt="Birthday photo"></div>
    <div id="message"></div>
  </div>

  <a id="wish-link" href="./wish.html">✨ QUAY ĐIỀU ƯỚC TUỔI MỚI ✨</a>
  <canvas id="scene"></canvas>

  <div id="initial" onclick="startAnimation()">
    <div class="flower-button">🌸</div>
    <div class="label">Click Me :)<br>Birthday Queen!</div>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const context = canvas.getContext("2d");
    const music = document.getElementById("bg-music");
    const photo = document.getElementById("birthday-photo");
    const message = document.getElementById("message");
    const wishLink = document.getElementById("wish-link");
    const initial = document.getElementById("initial");

    let width = 0;
    let height = 0;
    let phase = "idle";
    let phaseStartedAt = 0;
    let treeStartTime = null;
    let startX = 0;
    let startY = 0;
    let endX = 0;
    let endY = 0;
    let trail = [];
    let branches = [];
    let leaves = [];
    let treeFinished = false;
    let leavesFinished = false;
    let treeCache = null;
    let leavesCache = null;
    let messageStarted = false;

    let rollingFlower = { x: 0, y: 0, size: 48, alpha: 1, rotation: 0 };

    const COLORS = ["#ff1493", "#ff69b4", "#ff85a1", "#ffc2d4", "#e0115f", "#d63384", "#ff6b9d", "#ffa07a"];
    const LINES = ["Hey you 🌸", "Happy Birthday 🎂", "May God bless you 😇", "And give you lots of happiness ✨", "Just saying... you are pretty awesome 😍", "Hope you have a great day today 🌸"];

    function pick(list) { return list[Math.floor(Math.random() * list.length)]; }
    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      treeCache = null;
      leavesCache = null;
      if (treeFinished) bakeTree();
      if (leavesFinished) bakeLeaves();
    }
    window.addEventListener("resize", resizeCanvas);
    function easeInQuad(v) { return v * v; }
    function easeOutCubic(v) { return 1 - Math.pow(1 - v, 3); }

    function drawFlower(target, x, y, size, color, alpha, rotation) {
      target.save();
      target.translate(x, y);
      target.rotate(rotation);
      target.globalAlpha = alpha;
      target.fillStyle = color;
      for (let i = 0; i < 5; i++) {
        const a = Math.PI * 2 * i / 5;
        target.beginPath();
        target.arc(Math.cos(a) * size * .55, Math.sin(a) * size * .55, size * .45, 0, Math.PI * 2);
        target.fill();
      }
      target.fillStyle = "#ffe2f0";
      target.beginPath();
      target.arc(0, 0, Math.max(2, size * .2), 0, Math.PI * 2);
      target.fill();
      target.restore();
    }

    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    function addBranch(x1, y1, x2, y2, lineWidth, delay) {
      branches.push({ x1, y1, x2, y2, width: lineWidth, delay });
    }

    function addInnerBranch(x, y, angle, length, lineWidth, delay) {
      if (length < 6 || lineWidth < .75) return;
      const x2 = x + Math.cos(angle) * length;
      const y2 = y + Math.sin(angle) * length;
      addBranch(x, y, x2, y2, lineWidth, delay);
      if (Math.random() > .42) addInnerBranch(x2, y2, angle - .4, length * .64, lineWidth * .65, delay + 70);
      if (Math.random() > .42) addInnerBranch(x2, y2, angle + .4, length * .64, lineWidth * .65, delay + 70);
    }

    function buildHeartTree(rootX, rootY) {
      branches = [];
      leaves = [];
      const scale = Math.min(width, height) * .024;
      const stemHeight = height * .075;
      const stemTopY = rootY - stemHeight;
      addBranch(rootX, rootY, rootX, stemTopY, 10, 0);
      const points = 19;
      for (const direction of [1, -1]) {
        let previousX = rootX;
        let previousY = stemTopY;
        let previousWidth = 9;
        let delay = 150;
        for (let i = 1; i <= points; i++) {
          const point = getHeartPoint(Math.PI + direction * Math.PI * i / points);
          const currentX = rootX + point.x * scale;
          const currentY = stemTopY - (17 - point.y) * scale;
          const currentWidth = Math.max(1.4, previousWidth * .945);
          addBranch(previousX, previousY, currentX, currentY, currentWidth, delay);
          if (i > 2 && i < points - 1 && i % 3 === 0) {
            const centerY = stemTopY - 11 * scale;
            const angle = Math.atan2(centerY - currentY, rootX - currentX) + (Math.random() - .5) * .45;
            addInnerBranch(currentX, currentY, angle, scale * (2 + Math.random() * 1.4), currentWidth * .5, delay + 35);
          }
          previousX = currentX;
          previousY = currentY;
          previousWidth = currentWidth;
          delay += 50;
        }
      }
    }

    function drawBranch(target, x1, y1, x2, y2, lineWidth) {
      target.save();
      target.lineCap = "round";
      target.strokeStyle = "#ffc2d4";
      target.lineWidth = Math.max(1, lineWidth * .58);
      target.globalAlpha = .9;
      target.beginPath();
      target.moveTo(x1, y1);
      target.lineTo(x2, y2);
      target.stroke();
      target.restore();
    }

    function bakeTree() {
      treeCache = document.createElement("canvas");
      treeCache.width = width;
      treeCache.height = height;
      const cache = treeCache.getContext("2d");
      branches.forEach(b => drawBranch(cache, b.x1, b.y1, b.x2, b.y2, b.width));
    }

    function createFlowers(rootX, rootY) {
      leaves = [];
      const scale = Math.min(width, height) * .024;
      const stemHeight = height * .075;
      const centerX = rootX;
      const centerY = (rootY - stemHeight) - 11 * scale;
      const radiusX = 16 * scale * 1.05;
      const radiusY = 11 * scale * 1.05;
      for (let i = 0; i < 115; i++) {
        const point = getHeartPoint(Math.random() * Math.PI * 2);
        const spread = .18 + Math.random() * .82;
        leaves.push({
          x: centerX + point.x / 16 * radiusX * spread + (Math.random() - .5) * 16,
          y: centerY + (point.y - 6) / 11 * radiusY * spread + (Math.random() - .5) * 16,
          size: 4 + Math.random() * 7,
          color: pick(COLORS),
          rotation: Math.random() * Math.PI,
          delay: performance.now() + i * 8 + Math.random() * 260
        });
      }
      for (let i = 0; i < 32; i++) {
        const point = getHeartPoint(Math.random() * Math.PI * 2);
        leaves.push({
          x: centerX + point.x / 16 * radiusX + (Math.random() - .5) * 8,
          y: centerY + (point.y - 6) / 11 * radiusY + (Math.random() - .5) * 8,
          size: 3 + Math.random() * 4,
          color: pick(COLORS),
          rotation: Math.random() * Math.PI,
          delay: performance.now() + 800 + i * 14 + Math.random() * 180
        });
      }
    }

    function bakeLeaves() {
      leavesCache = document.createElement("canvas");
      leavesCache.width = width;
      leavesCache.height = height;
      const cache = leavesCache.getContext("2d");
      leaves.forEach(l => drawFlower(cache, l.x, l.y, l.size, l.color, 1, l.rotation));
    }

    function drawTrail() {
      if (trail.length < 2) return;
      context.save();
      context.strokeStyle = "#ff69b4";
      context.globalAlpha = .28;
      context.lineWidth = 5;
      context.lineCap = "round";
      context.lineJoin = "round";
      context.beginPath();
      context.moveTo(trail[0].x, trail[0].y);
      for (let i = 1; i < trail.length; i++) context.lineTo(trail[i].x, trail[i].y);
      context.stroke();
      context.restore();
    }

    function updateAnimation(timestamp) {
      if (phase === "drop") {
        const p = Math.min(1, (timestamp - phaseStartedAt) / 650);
        rollingFlower.y = startY + (endY - startY) * easeInQuad(p);
        rollingFlower.rotation = p * .4;
        trail.push({ x: rollingFlower.x, y: rollingFlower.y });
        if (p >= 1) { phase = "roll"; phaseStartedAt = timestamp; }
      } else if (phase === "roll") {
        const p = Math.min(1, (timestamp - phaseStartedAt) / 1000);
        rollingFlower.x = startX + (endX - startX) * easeOutCubic(p);
        rollingFlower.y = endY - Math.abs(Math.sin(p * Math.PI * 4)) * (12 * Math.pow(1 - p, 1.5));
        rollingFlower.rotation = (rollingFlower.x - startX) / rollingFlower.size;
        trail.push({ x: rollingFlower.x, y: rollingFlower.y });
        if (p >= 1) {
          phase = "tree";
          treeStartTime = timestamp;
          rollingFlower.alpha = 0;
          buildHeartTree(endX, endY);
        }
      }
    }

    function drawTreeAndFlowers(timestamp) {
      if (phase !== "tree" || treeStartTime === null) return;
      const elapsed = timestamp - treeStartTime;
      if (treeCache) {
        context.drawImage(treeCache, 0, 0);
      } else {
        let complete = true;
        branches.forEach(b => {
          const p = Math.min(1, Math.max(0, (elapsed - b.delay) / 220));
          if (p < 1) complete = false;
          if (p > 0) drawBranch(context, b.x1, b.y1, b.x1 + (b.x2 - b.x1) * p, b.y1 + (b.y2 - b.y1) * p, b.width);
        });
        if (complete && branches.length && !treeFinished) {
          treeFinished = true;
          bakeTree();
          createFlowers(endX, endY);
        }
      }
      if (leavesCache) {
        context.drawImage(leavesCache, 0, 0);
      } else if (treeFinished) {
        let complete = true;
        leaves.forEach(l => {
          const p = Math.min(1, Math.max(0, (timestamp - l.delay) / 160));
          if (p < 1) complete = false;
          if (p > 0) drawFlower(context, l.x, l.y, l.size * p, l.color, p, l.rotation);
        });
        if (complete && leaves.length && !leavesFinished) {
          leavesFinished = true;
          bakeLeaves();
          if (!messageStarted) { messageStarted = true; startTypewriter(); }
        }
      }
    }

    function render(timestamp) {
      context.clearRect(0, 0, width, height);
      if (phase !== "idle") updateAnimation(timestamp);
      if (phase === "drop" || phase === "roll") {
        drawTrail();
        drawFlower(context, rollingFlower.x, rollingFlower.y, rollingFlower.size, "#ff1493", rollingFlower.alpha, rollingFlower.rotation);
      }
      drawTreeAndFlowers(timestamp);
      requestAnimationFrame(render);
    }

    function startAnimation() {
      if (phase !== "idle") return;
      if (music) { music.volume = .35; music.play().catch(() => {}); }
      const rect = document.querySelector("#initial .flower-button").getBoundingClientRect();
      startX = rect.left + rect.width / 2;
      startY = rect.top + rect.height / 2;
      endX = width < 780 ? width * .5 : width * .80;
      endY = height * .83;
      rollingFlower = { x: startX, y: startY, size: Math.max(38, Math.min(62, rect.width * .5)), alpha: 1, rotation: 0 };
      trail = [{ x: startX, y: startY }];
      initial.style.opacity = "0";
      setTimeout(() => { initial.style.display = "none"; }, 300);
      phase = "drop";
      phaseStartedAt = performance.now();
    }

    function startTypewriter() {
      photo.classList.add("visible");
      message.style.opacity = "1";
      let lineIndex = 0;
      function typeNextLine() {
        if (lineIndex >= LINES.length) { wishLink.classList.add("visible"); return; }
        const el = document.createElement("span");
        el.style.borderRight = "2px solid #ff69b4";
        el.style.animation = "blink .65s step-end infinite";
        message.appendChild(el);
        const text = LINES[lineIndex];
        let charIndex = 0;
        const timer = setInterval(() => {
          if (charIndex <= text.length) {
            el.textContent = text.substring(0, charIndex++);
          } else {
            clearInterval(timer);
            el.style.borderRight = "none";
            el.style.animation = "none";
            lineIndex++;
            setTimeout(typeNextLine, 380);
          }
        }, 50);
      }
      typeNextLine();
    }

    resizeCanvas();
    requestAnimationFrame(render);
  </script>
</body>
</html>
