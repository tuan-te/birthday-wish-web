<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🌸</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      min-height: 100vh;
      overflow: hidden;
      color: #fff;
      background: #060007;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    /* =====================================================
       BACKGROUND
       ===================================================== */

    .aurora-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      background:
        radial-gradient(circle at 15% 20%, rgba(255, 20, 147, 0.18), transparent 31%),
        radial-gradient(circle at 83% 74%, rgba(124, 58, 237, 0.16), transparent 34%),
        radial-gradient(circle at 57% 12%, rgba(255, 130, 180, 0.10), transparent 28%),
        linear-gradient(135deg, #050006 0%, #170012 50%, #030004 100%);
      background-size: 130% 130%;
      animation: auroraMove 16s ease-in-out infinite alternate;
    }

    @keyframes auroraMove {
      0% {
        background-position: 0% 0%, 100% 100%, 50% 0%, 0% 0%;
      }

      100% {
        background-position: 18% 12%, 82% 88%, 68% 16%, 100% 100%;
      }
    }

    .glow-orb {
      position: fixed;
      z-index: -3;
      width: 32vmax;
      height: 32vmax;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.14;
      pointer-events: none;
      will-change: transform;
    }

    .orb-one {
      top: -18vmax;
      left: -12vmax;
      background: #ff1493;
      animation: driftOne 18s ease-in-out infinite alternate;
    }

    .orb-two {
      right: -15vmax;
      bottom: -22vmax;
      background: #6d28d9;
      opacity: 0.12;
      animation: driftTwo 22s ease-in-out infinite alternate;
    }

    @keyframes driftOne {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(12vw, 8vh, 0) scale(1.15);
      }
    }

    @keyframes driftTwo {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }

      to {
        transform: translate3d(-12vw, -10vh, 0) scale(1.16);
      }
    }

    .sparkles {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkles span {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      opacity: 0.25;
      background: #ffd1ec;
      box-shadow: 0 0 5px #ff69b4, 0 0 12px #ff1493;
      animation: twinkle 2.8s ease-in-out infinite alternate;
    }

    .sparkles span:nth-child(1) { top: 12%; left: 7%; animation-delay: 0s; }
    .sparkles span:nth-child(2) { top: 28%; left: 20%; animation-delay: 0.7s; }
    .sparkles span:nth-child(3) { top: 8%; left: 42%; animation-delay: 1.3s; }
    .sparkles span:nth-child(4) { top: 20%; left: 71%; animation-delay: 0.4s; }
    .sparkles span:nth-child(5) { top: 12%; left: 91%; animation-delay: 1.8s; }
    .sparkles span:nth-child(6) { top: 43%; left: 6%; animation-delay: 1.2s; }
    .sparkles span:nth-child(7) { top: 51%; left: 34%; animation-delay: 0.2s; }
    .sparkles span:nth-child(8) { top: 39%; left: 58%; animation-delay: 1.5s; }
    .sparkles span:nth-child(9) { top: 62%; left: 82%; animation-delay: 0.9s; }
    .sparkles span:nth-child(10) { top: 76%; left: 14%; animation-delay: 1.9s; }
    .sparkles span:nth-child(11) { top: 85%; left: 39%; animation-delay: 0.5s; }
    .sparkles span:nth-child(12) { top: 80%; left: 61%; animation-delay: 1.1s; }

    @keyframes twinkle {
      from {
        opacity: 0.12;
        transform: scale(0.55);
      }

      to {
        opacity: 0.92;
        transform: scale(1.7);
      }
    }

    /* =====================================================
       INTRO
       ===================================================== */

    #initial {
      position: fixed;
      bottom: 24%;
      left: 50%;
      z-index: 20;
      cursor: pointer;
      text-align: center;
      transform: translateX(-50%);
      transition: opacity 0.6s ease;
      font-family: "Dancing Script", cursive;
    }

    #initial .flower-button {
      display: inline-block;
      font-size: clamp(72px, 9vw, 112px);
      animation: pulse 1.1s ease-in-out infinite;
      filter:
        drop-shadow(0 0 12px #ff69b4)
        drop-shadow(0 0 28px #ff1493)
        drop-shadow(0 0 48px #c71585);
    }

    #initial .label {
      margin-top: 7px;
      color: #ffb6d9;
      font-size: clamp(22px, 2.6vw, 33px);
      letter-spacing: 1.5px;
      line-height: 1.55;
      text-shadow: 0 0 10px #ff69b4, 0 0 22px #ff1493;
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.18);
      }
    }

    /* =====================================================
       ẢNH VÀ LỜI CHÚC
       ===================================================== */

    #content-column {
      position: fixed;
      top: 8vh;
      left: 3vw;
      z-index: 10;

      width: min(43vw, 580px);
      max-width: 580px;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;

      pointer-events: none;
    }

    #birthday-photo {
      width: min(28vw, 300px);
      aspect-ratio: 1 / 1;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }

    #birthday-photo.visible {
      opacity: 1;
      visibility: visible;
    }

    #birthday-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: 2px solid rgba(255, 105, 180, 0.6);
      border-radius: 18px;
      box-shadow: 0 0 22px rgba(255, 20, 147, 0.35);
    }

    #message {
      width: fit-content;
      min-width: min(340px, 100%);
      max-width: 100%;
      min-height: 105px;
      max-height: 51vh;
      overflow-y: auto;
      overflow-x: hidden;

      padding: 16px 24px;
      border: 1px solid rgba(255, 105, 180, 0.25);
      border-radius: 16px;

      color: #fff;
      opacity: 0;
      text-align: center;

      font-family: "Dancing Script", cursive;
      font-size: clamp(17px, 1.75vw, 26px);
      line-height: 1.65;

      background: rgba(17, 0, 14, 0.52);
      box-shadow: 0 0 16px rgba(255, 20, 147, 0.14);

      transition: opacity 0.7s ease;
    }

    #message span {
      display: block;
      width: max-content;
      max-width: 100%;
      white-space: nowrap;
      overflow-wrap: anywhere;
      text-shadow: 0 0 5px #ff69b4, 0 0 9px #ff1493;
    }

    @keyframes blink {
      50% {
        border-color: transparent;
      }
    }

    /* =====================================================
       NÚT QUA VÒNG QUAY
       Nút này nằm ngoài content-column nên click được.
       ===================================================== */

    #wish-link {
      position: fixed;
      bottom: 6vh;
      left: 50%;
      z-index: 50;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 12px 20px;
      border: 1px solid rgba(255, 220, 238, 0.75);
      border-radius: 999px;

      color: #fff;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      pointer-events: auto;
      text-decoration: none;

      transform: translateX(-50%) translateY(12px);

      font-family: "Poppins", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      white-space: nowrap;

      background: linear-gradient(135deg, #ff1493, #8b5cf6);
      box-shadow: 0 0 18px rgba(255, 20, 147, 0.45);

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease,
        transform 0.5s ease,
        filter 0.2s ease;
    }

    #wish-link.visible {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    #wish-link:hover {
      filter: brightness(1.15);
    }

    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 780px) {
      .glow-orb {
        filter: blur(38px);
        opacity: 0.1;
      }

      .sparkles span:nth-child(n + 9) {
        display: none;
      }

      #initial {
        bottom: 30%;
      }

      #content-column {
        top: 5vh;
        left: 50%;
        width: 88vw;
        max-width: 460px;
        gap: 14px;
        transform: translateX(-50%);
      }

      #birthday-photo {
        width: min(48vw, 190px);
      }

      #message {
        min-width: min(82vw, 330px);
        max-height: 43vh;
        padding: 14px 16px;
        font-size: clamp(15px, 4vw, 22px);
      }

      #message span {
        white-space: normal;
      }

      #wish-link {
        bottom: 3vh;
        max-width: 88vw;
        padding: 11px 16px;
        text-align: center;
        white-space: normal;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .aurora-bg,
      .glow-orb,
      .sparkles span,
      #initial .flower-button {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <!-- Background -->
  <div class="aurora-bg"></div>

  <div class="glow-orb orb-one"></div>
  <div class="glow-orb orb-two"></div>

  <div class="sparkles">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <!-- Nhạc nền: cần có file birthday.mp3 cùng thư mục -->
  <audio id="bg-music" loop preload="auto">
    <source src="./birthday.mp3" type="audio/mpeg">
  </audio>

  <!-- Ảnh + lời chúc -->
  <div id="content-column">
    <div id="birthday-photo">
      <img src="./image.jpg" alt="Birthday photo">
    </div>

    <div id="message"></div>
  </div>

  <!-- Nút quay: phải nằm NGOÀI content-column -->
  <a id="wish-link" href="./wish.html">
    ✨ QUAY ĐIỀU ƯỚC TUỔI MỚI ✨
  </a>

  <!-- Canvas animation hoa -->
  <canvas id="scene"></canvas>

  <!-- Màn mở đầu -->
  <div id="initial" onclick="startAnimation()">
    <div class="flower-button">🌸</div>
    <div class="label">Click Me :)<br>Birthday Queen!</div>
  </div>

  <script>
    const canvas = document.getElementById("scene");
    const context = canvas.getContext("2d");

    const music = document.getElementById("bg-music");
    const photo = document.getElementById("birthday-photo");
    const message = document.getElementById("message");
    const wishLink = document.getElementById("wish-link");
    const initial = document.getElementById("initial");

    let width = 0;
    let height = 0;

    let phase = "idle";
    let phaseStartedAt = 0;
    let bloomStartedAt = null;

    let rollingFlower = {
      x: 0,
      y: 0,
      size: 48,
      alpha: 1,
      scale: 1,
      rotation: 0
    };

    let startX = 0;
    let startY = 0;
    let endX = 0;
    let endY = 0;

    let trail = [];
    let flowers = [];
    let finalFlowersCache = null;
    let messageStarted = false;

    const COLORS = [
      "#ff1493",
      "#ff69b4",
      "#ff85a1",
      "#ffc2d4",
      "#e0115f",
      "#d63384",
      "#ff6b9d",
      "#ffa07a"
    ];

    const LINES = [
      "Hey you 🌸",
      "Happy Birthday 🎂",
      "May God bless you 😇",
      "And give you lots of happiness ✨",
      "Just saying... you are pretty awesome 😍",
      "Hope you have a great day today 🌸"
    ];

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width;
      canvas.height = height;

      finalFlowersCache = null;
    }

    window.addEventListener("resize", resizeCanvas);

    function easeInQuad(value) {
      return value * value;
    }

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - value, 3);
    }

    function drawFlower(x, y, size, color, alpha, rotation) {
      context.save();

      context.translate(x, y);
      context.rotate(rotation);
      context.globalAlpha = alpha;
      context.fillStyle = color;

      for (let i = 0; i < 5; i++) {
        const angle = (Math.PI * 2 / 5) * i;
        const petalX = Math.cos(angle) * size * 0.55;
        const petalY = Math.sin(angle) * size * 0.55;

        context.beginPath();
        context.arc(petalX, petalY, size * 0.45, 0, Math.PI * 2);
        context.fill();
      }

      context.fillStyle = "#ffe2f0";
      context.beginPath();
      context.arc(0, 0, Math.max(2, size * 0.20), 0, Math.PI * 2);
      context.fill();

      context.restore();
    }

    function createFlowerBloom(centerX, centerY) {
      flowers = [];

      /*
        Hình bông hoa lớn gồm:
        - 5 cánh bằng cụm hoa.
        - 1 phần tâm hoa.
        - Tổng khoảng 78 bông, vẫn nhẹ.
      */
      const petalRadius = Math.min(width, height) * 0.12;
      const bloomScale = Math.min(width, height) * 0.17;

      for (let petal = 0; petal < 5; petal++) {
        const petalAngle = (Math.PI * 2 / 5) * petal - Math.PI / 2;
        const petalCenterX = centerX + Math.cos(petalAngle) * petalRadius;
        const petalCenterY = centerY + Math.sin(petalAngle) * petalRadius;

        for (let i = 0; i < 12; i++) {
          const randomAngle = Math.random() * Math.PI * 2;
          const randomDistance = Math.random() * bloomScale * 0.38;

          flowers.push({
            x: petalCenterX + Math.cos(randomAngle) * randomDistance,
            y: petalCenterY + Math.sin(randomAngle) * randomDistance,
            size: 5 + Math.random() * 8,
            color: pick(COLORS),
            rotation: Math.random() * Math.PI,
            delay: performance.now() + petal * 110 + i * 16
          });
        }
      }

      for (let i = 0; i < 18; i++) {
        const randomAngle = Math.random() * Math.PI * 2;
        const randomDistance = Math.random() * bloomScale * 0.24;

        flowers.push({
          x: centerX + Math.cos(randomAngle) * randomDistance,
          y: centerY + Math.sin(randomAngle) * randomDistance,
          size: 4 + Math.random() * 7,
          color: i % 2 === 0 ? "#ffd166" : "#ff85a1",
          rotation: Math.random() * Math.PI,
          delay: performance.now() + 600 + i * 14
        });
      }
    }

    function bakeFinalBloom() {
      finalFlowersCache = document.createElement("canvas");
      finalFlowersCache.width = width;
      finalFlowersCache.height = height;

      const cacheContext = finalFlowersCache.getContext("2d");

      for (const flower of flowers) {
        cacheContext.save();
        cacheContext.translate(flower.x, flower.y);
        cacheContext.rotate(flower.rotation);
        cacheContext.fillStyle = flower.color;

        for (let i = 0; i < 5; i++) {
          const angle = (Math.PI * 2 / 5) * i;
          const petalX = Math.cos(angle) * flower.size * 0.55;
          const petalY = Math.sin(angle) * flower.size * 0.55;

          cacheContext.beginPath();
          cacheContext.arc(
            petalX,
            petalY,
            flower.size * 0.45,
            0,
            Math.PI * 2
          );
          cacheContext.fill();
        }

        cacheContext.fillStyle = "#ffe2f0";
        cacheContext.beginPath();
        cacheContext.arc(0, 0, Math.max(2, flower.size * 0.20), 0, Math.PI * 2);
        cacheContext.fill();

        cacheContext.restore();
      }
    }

    function drawTrail() {
      if (trail.length < 2) return;

      context.save();

      context.strokeStyle = "#ff69b4";
      context.globalAlpha = 0.28;
      context.lineWidth = 5;
      context.lineCap = "round";
      context.lineJoin = "round";

      context.beginPath();
      context.moveTo(trail[0].x, trail[0].y);

      for (let i = 1; i < trail.length; i++) {
        context.lineTo(trail[i].x, trail[i].y);
      }

      context.stroke();
      context.restore();
    }

    function updateAnimation(timestamp) {
      if (phase === "drop") {
        const duration = 650;
        const progress = Math.min(1, (timestamp - phaseStartedAt) / duration);
        const eased = easeInQuad(progress);

        rollingFlower.y = startY + (endY - startY) * eased;
        rollingFlower.rotation = eased * 0.4;

        trail.push({
          x: rollingFlower.x,
          y: rollingFlower.y
        });

        if (progress >= 1) {
          phase = "roll";
          phaseStartedAt = timestamp;
        }
      }

      if (phase === "roll") {
        const duration = 1000;
        const progress = Math.min(1, (timestamp - phaseStartedAt) / duration);
        const eased = easeOutCubic(progress);

        rollingFlower.x = startX + (endX - startX) * eased;
        rollingFlower.y =
          endY -
          Math.abs(Math.sin(progress * Math.PI * 4)) *
          (12 * Math.pow(1 - progress, 1.5));

        rollingFlower.rotation =
          (rollingFlower.x - startX) / rollingFlower.size;

        trail.push({
          x: rollingFlower.x,
          y: rollingFlower.y
        });

        if (progress >= 1) {
          phase = "bloom";
          bloomStartedAt = timestamp;
          rollingFlower.alpha = 0;
          createFlowerBloom(endX, endY - height * 0.22);
        }
      }

      if (phase === "bloom" && bloomStartedAt !== null) {
        const totalBloomTime = 1800;

        if (
          timestamp - bloomStartedAt > totalBloomTime &&
          !messageStarted
        ) {
          messageStarted = true;
          bakeFinalBloom();
          startTypewriter();
        }
      }
    }

    function drawBloom(timestamp) {
      if (phase !== "bloom") return;

      if (finalFlowersCache) {
        context.drawImage(finalFlowersCache, 0, 0);
        return;
      }

      for (const flower of flowers) {
        const progress = Math.min(
          1,
          Math.max(0, (timestamp - flower.delay) / 180)
        );

        if (progress <= 0) continue;

        drawFlower(
          flower.x,
          flower.y,
          flower.size * progress,
          flower.color,
          progress,
          flower.rotation
        );
      }
    }

    function render(timestamp) {
      context.clearRect(0, 0, width, height);

      if (phase !== "idle") {
        updateAnimation(timestamp);
      }

      if (phase === "drop" || phase === "roll") {
        drawTrail();

        drawFlower(
          rollingFlower.x,
          rollingFlower.y,
          rollingFlower.size * rollingFlower.scale,
          "#ff1493",
          rollingFlower.alpha,
          rollingFlower.rotation
        );
      }

      drawBloom(timestamp);

      requestAnimationFrame(render);
    }

    function startAnimation() {
      if (phase !== "idle") return;

      if (music) {
        music.volume = 0.35;
        music.play().catch(() => {});
      }

      const flowerButton = document.querySelector("#initial .flower-button");
      const rect = flowerButton.getBoundingClientRect();

      startX = rect.left + rect.width / 2;
      startY = rect.top + rect.height / 2;

      endX = width < 780 ? width * 0.5 : width * 0.80;
      endY = height * 0.83;

      rollingFlower = {
        x: startX,
        y: startY,
        size: Math.max(38, Math.min(62, rect.width * 0.5)),
        alpha: 1,
        scale: 1,
        rotation: 0
      };

      trail = [{
        x: startX,
        y: startY
      }];

      initial.style.opacity = "0";

      setTimeout(() => {
        initial.style.display = "none";
      }, 300);

      phase = "drop";
      phaseStartedAt = performance.now();
    }

    function startTypewriter() {
      photo.classList.add("visible");
      message.style.opacity = "1";

      let lineIndex = 0;

      function typeNextLine() {
        if (lineIndex >= LINES.length) {
          wishLink.classList.add("visible");
          return;
        }

        const lineElement = document.createElement("span");
        lineElement.style.borderRight = "2px solid #ff69b4";
        lineElement.style.animation = "blink .65s step-end infinite";

        message.appendChild(lineElement);

        const text = LINES[lineIndex];
        let characterIndex = 0;

        const typingTimer = setInterval(() => {
          if (characterIndex <= text.length) {
            lineElement.textContent = text.substring(0, characterIndex);
            characterIndex++;
          } else {
            clearInterval(typingTimer);

            lineElement.style.borderRight = "none";
            lineElement.style.animation = "none";

            lineIndex++;
            setTimeout(typeNextLine, 380);
          }
        }, 50);
      }

      typeNextLine();
    }

    resizeCanvas();
    requestAnimationFrame(render);
  </script>
</body>
</html>
