<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Điều ước tuổi mới ✨</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(circle at 14% 18%, rgba(255, 20, 147, 0.28), transparent 30%),
        radial-gradient(circle at 86% 76%, rgba(124, 58, 237, 0.24), transparent 34%),
        linear-gradient(135deg, #09000a 0%, #240019 48%, #080008 100%);
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, 94%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 82px 0 40px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .back-button {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;

      padding: 10px 14px;
      border: 1px solid rgba(255, 210, 235, 0.42);
      border-radius: 999px;

      color: #ffd5eb;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;

      background: rgba(25, 0, 20, 0.72);
      box-shadow: 0 0 14px rgba(255, 20, 147, 0.2);

      transition: transform 0.2s ease, background 0.2s ease;
    }

    .back-button:hover {
      transform: translateY(-2px);
      background: rgba(255, 20, 147, 0.22);
    }

    .layout {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(300px, 520px) minmax(260px, 390px);
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vw, 75px);
    }

    .wheel-area {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wheel-wrapper {
      position: relative;
      width: min(78vw, 500px);
      aspect-ratio: 1 / 1;
    }

    .pointer {
      position: absolute;
      top: -16px;
      left: 50%;
      z-index: 10;

      width: 0;
      height: 0;

      transform: translateX(-50%);

      border-right: 24px solid transparent;
      border-left: 24px solid transparent;
      border-top: 46px solid #ffe2f0;

      filter: drop-shadow(0 0 8px #ff1493);
    }

    #wheel {
      position: absolute;
      inset: 0;

      overflow: hidden;
      border: 8px solid #ffe1ef;
      border-radius: 50%;

      background:
        conic-gradient(
          #ff477e 0deg 45deg,
          #8b5cf6 45deg 90deg,
          #ff9d5c 90deg 135deg,
          #e11d48 135deg 180deg,
          #a855f7 180deg 225deg,
          #fb7185 225deg 270deg,
          #7c3aed 270deg 315deg,
          #ff6b9d 315deg 360deg
        );

      box-shadow:
        0 0 0 5px rgba(255, 20, 147, 0.16),
        0 0 32px rgba(255, 20, 147, 0.48);

      transition: transform 5.7s cubic-bezier(0.12, 0.78, 0.08, 1);
    }

    #wheel::before {
      position: absolute;
      inset: 0;
      content: "";

      background:
        repeating-conic-gradient(
          from 0deg,
          transparent 0deg 43.4deg,
          rgba(255, 255, 255, 0.42) 43.4deg 45deg
        );

      pointer-events: none;
    }

    #wheel::after {
      position: absolute;
      top: 50%;
      left: 50%;

      width: 74px;
      height: 74px;
      border: 5px solid #ffd7e9;
      border-radius: 50%;

      content: "";
      transform: translate(-50%, -50%);

      background:
        radial-gradient(circle at 35% 30%, #ffb6d9, #ff1493 70%);

      box-shadow: 0 0 16px #ff1493;
    }

    .wheel-label {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;

      width: 116px;
      min-height: 68px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #fff;
      font-size: clamp(11px, 1.25vw, 14px);
      font-weight: 700;
      line-height: 1.18;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.85);

      transform-origin: center center;
      pointer-events: none;
    }

    .wheel-label span {
      display: block;
      margin-bottom: 3px;
      font-size: 23px;
    }

    #spin-button {
      margin-top: 28px;
      padding: 14px 28px;
      border: 1px solid rgba(255, 240, 248, 0.72);
      border-radius: 999px;

      color: #fff;
      cursor: pointer;

      font-family: "Poppins", sans-serif;
      font-size: 15px;
      font-weight: 700;

      background: linear-gradient(135deg, #ff1493, #8b5cf6);
      box-shadow: 0 0 18px rgba(255, 20, 147, 0.52);

      transition: transform 0.2s ease, filter 0.2s ease;
    }

    #spin-button:hover:not(:disabled) {
      filter: brightness(1.12);
      transform: translateY(-3px);
    }

    #spin-button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .result-box {
      min-height: 360px;
      padding: 30px 26px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      background: rgba(24, 0, 19, 0.62);
      border: 1px solid rgba(255, 194, 212, 0.28);
      border-radius: 24px;
      box-shadow: 0 0 24px rgba(255, 20, 147, 0.18);
    }

    .status {
      display: inline-block;
      width: fit-content;
      margin-bottom: 14px;
      padding: 6px 10px;

      border: 1px solid rgba(255, 105, 180, 0.4);
      border-radius: 999px;

      color: #ffb6d9;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;

      background: rgba(255, 20, 147, 0.14);
    }

    .result-box h2 {
      margin-bottom: 12px;
      color: #ffd9ec;
      font-family: "Dancing Script", cursive;
      font-size: clamp(34px, 3.5vw, 48px);
      line-height: 1;
      text-shadow: 0 0 10px rgba(255, 20, 147, 0.55);
    }

    #result {
      min-height: 100px;
      color: rgba(255, 235, 245, 0.92);
      font-size: 15px;
      line-height: 1.7;
    }

    #result strong {
      display: block;
      margin: 12px 0;
      color: #fff;
      font-size: 19px;
      line-height: 1.45;
    }

    .final-message {
      display: none;
      margin-top: 18px;
      padding-top: 18px;

      border-top: 1px dashed rgba(255, 194, 212, 0.35);

      color: #ffd5ea;
      font-family: "Dancing Script", cursive;
      font-size: 24px;
      line-height: 1.45;
    }

    .final-message.show {
      display: block;
    }

    @media (max-width: 820px) {
      .page {
        padding-top: 86px;
      }

      .layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .wheel-wrapper {
        width: min(84vw, 430px);
      }

      .result-box {
        width: min(92vw, 500px);
        min-height: auto;
      }

      .wheel-label {
        width: 90px;
        min-height: 58px;
        font-size: 11px;
      }

      .wheel-label span {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <a class="back-button" href="./index.html">
    ← Quay lại thiệp
  </a>

  <main class="page">
    <section class="layout">
      <div class="wheel-area">
        <div class="wheel-wrapper">
          <div class="pointer"></div>
          <div id="wheel"></div>
        </div>

        <button id="spin-button" type="button">
          ✨ Quay thui quay thui ✨
        </button>
      </div>

      <aside class="result-box">
        <span id="status" class="status">HỆ THỐNG ĐANG CHỜ</span>

        <h2>Quà tuổi mới</h2>

        <div id="result">
          Nhìn cái đéo gì, bấm quay đi má !?
        </div>

        <div id="final-message" class="final-message">
          Dừa cái lồn t lắm.
        </div>
      </aside>
    </section>
  </main>

  <script>
    /*
      Mỗi object là một ô cụ thể trên vòng quay.

      badResult:
      Kết quả ứng với đúng ô đó.
      Kim dừng vào ô nào thì show đúng kết quả của ô đó.
    */
    const SLOTS = [
      {
        icon: "💰",
        label: "Tiền dô như nước",
        badResult: "💸 Tiền dô tay trái, ra tay phải."
      },
      {
        icon: "💌",
        label: "Con ghệ đíc bự",
        badResult: "💌 Ghệ đíc bự của tui ròi, tự kiếm đi bạn."
      },
      {
        icon: "🎓",
        label: "Bé giỏi bé ngoan",
        badResult: "🎓 Giỏi thì được, ngoan là ngoan cái chó gì?"
      },
      {
        icon: "🍗",
        label: "Ăn uống ngập l",
        badResult: "🍗 Ăn uống ngập l, ráng ăn cho bự ra bạn."
      },
      {
        icon: "💤",
        label: "Ngủ phè cái l",
        badResult: "💤 Ngủ phè cái l, dậy mệt lòi l."
      },
      {
        icon: "🏋️",
        label: "Body siu mẫu",
        badResult: "🏋️ Chắc 40kg cả bỉm, ăn nhiều lên bạn."
      },
      {
        icon: "🌸",
        label: "Thiếu nữ bên hoa huệ",
        badResult: "🌸 Thiếu nữ bên hoa huệ, huệ huệ huệ."
      },
      {
        icon: "💅",
        label: "Slay mama ten",
        badResult: "💅 Muốn slay thì pick Lauriel đi SP thay vì con l Chaugnar."
      }
    ];

    const wheel = document.getElementById("wheel");
    const spinButton = document.getElementById("spin-button");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const finalMessage = document.getElementById("final-message");

    const slotAngle = 360 / SLOTS.length;

    let rotation = 0;
    let spinning = false;

    function placeLabels() {
      const oldLabels = wheel.querySelectorAll(".wheel-label");

      oldLabels.forEach(label => label.remove());

      const radius = wheel.clientWidth * 0.31;

      SLOTS.forEach((slot, index) => {
        const angle = index * slotAngle + slotAngle / 2;
        const radians = (angle - 90) * Math.PI / 180;

        const label = document.createElement("div");
        label.className = "wheel-label";

        const x = Math.cos(radians) * radius;
        const y = Math.sin(radians) * radius;

        label.style.transform =
          `translate(-50%, -50%) translate(${x}px, ${y}px)`;

        label.innerHTML = `
          <span>${slot.icon}</span>
          ${slot.label}
        `;

        wheel.appendChild(label);
      });
    }

    function spinWheel() {
      if (spinning) return;

      spinning = true;
      spinButton.disabled = true;
      finalMessage.classList.remove("show");

      status.textContent = "ĐỢI XÍU ĐANG LAG";
      result.innerHTML = `
        Đang đọc vận mệnh tuổi mới...<br>
        Đang lọc các điều ngon nghẻ...<br>
        Đang chọn cái phù hợp nhất với bạn...
      `;

      /*
        Chọn ô trúng.
        visualSlot chính là object được dùng để:
        1. Tính góc quay.
        2. Lấy badResult.
        => Không còn chuyện quay trúng A nhưng show kết quả B.
      */
      const selectedIndex =
        Math.floor(Math.random() * SLOTS.length);

      const selectedSlot = SLOTS[selectedIndex];

      /*
        Góc tâm của ô trúng.
        Kim nằm ở hướng 12 giờ.
      */
      const targetSlotCenter =
        selectedIndex * slotAngle + slotAngle / 2;

      const fullTurns =
        7 + Math.floor(Math.random() * 3);

      const normalizedRotation =
        ((rotation % 360) + 360) % 360;

      rotation +=
        fullTurns * 360 +
        (360 - targetSlotCenter - normalizedRotation);

      wheel.style.transform =
        `rotate(${rotation}deg)`;

      setTimeout(() => {
        status.textContent = "KẾT QUẢ";

        result.innerHTML = `
          Chúc mừng bạn nha!
          <strong>${selectedSlot.badResult}</strong>
          Điều ước đã được vũ trụ xử lý đúng theo hướng rất riêng.
        `;

        finalMessage.classList.add("show");

        spinButton.disabled = false;
        spinButton.textContent = "🔁 Cho m quay lại đó";

        spinning = false;
      }, 5900);
    }

    placeLabels();

    window.addEventListener("resize", placeLabels);

    spinButton.addEventListener("click", spinWheel);
  </script>
</body>
</html>
